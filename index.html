<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ثبت اطلاعات کاربران</title>

  <!--
    ============================================================
    فیلدهای فرم و هدرهای ارسالی به Google Sheet
    ============================================================
    name="fullName"      ->  ستون: نام و نام خانوادگی
    name="nationalId"    ->  ستون: کد ملی
    name="phone"         ->  ستون: شماره تماس
    name="fieldOfStudy"  ->  ستون: رشته
    name="userGroup"     ->  ستون: گروه
    submittedAt          ->  ستون: تاریخ ثبت (در Apps Script اضافه می‌شود)
    ============================================================
  -->

  <style>
    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Vazirmatn', 'IRANSans', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f7 0%, #dfe7f1 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(12px, 4vw, 40px) clamp(10px, 3vw, 24px);
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border-radius: 16px;
      padding: clamp(18px, 4vw, 34px);
      box-shadow: 0 10px 30px rgba(16, 24, 40, .12);
    }

    h2 {
      margin: 0 0 6px;
      text-align: center;
      color: #1f2d3d;
      
      font-size: clamp(18px, 4.5vw, 23px);
    }
    h1 {
      margin: 0 0 6px;
      text-align: center;
      color: #1f2d3d;
      font-size: clamp(18px, 4.5vw, 23px);
    }
    .subtitle {
      text-align: center;
      color: #7b8794;
      font-size: clamp(12px, 3vw, 13.5px);
      margin: 0 0 22px;
      line-height: 1.7;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0 16px;
    }

    @media (min-width: 560px) {
      .form-grid { grid-template-columns: 1fr 1fr; }
      .form-grid .full { grid-column: 1 / -1; }
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
      font-size: 14px;
      color: #344054;
    }

    .req { color: #dc3545; margin-right: 3px; }

    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 15px;
      color: #1f2d3d;
      background: #fbfcfe;
      border: 1.5px solid #d5dbe3;
      border-radius: 10px;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    textarea { resize: vertical; min-height: 90px; }

    input:focus, select:focus, textarea:focus {
      outline: none;
      background: #fff;
      border-color: #28a745;
      box-shadow: 0 0 0 3px rgba(40, 167, 69, .15);
    }

    input.invalid, select.invalid, textarea.invalid {
      border-color: #dc3545;
      box-shadow: 0 0 0 3px rgba(220, 53, 69, .12);
    }

    /* ---------- بخش لوگو ---------- */




    /* ---------- دکمه ارسال ---------- */
    #submitBtn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #28a745;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }

    #submitBtn:hover:not(:disabled) { background: #218838; }
    #submitBtn:active:not(:disabled) { transform: scale(.99); }

    #submitBtn:disabled {
      background: #9bbfa6;
      cursor: not-allowed;
    }

    /* ---------- پیام‌ها ---------- */
    #message {
      margin-top: 14px;
      min-height: 22px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.8;
    }

    #message.success { color: #1e7e34; }
    #message.error   { color: #dc3545; }
  </style>

  <style>
    img{width: 60%;}
    picture{direction: ltr;}
  </style>
</head>
<body>

  <div class="container">
    <div style="direction: ltr;">
<picture><img src="./statics/logocm01.png" alt="MOKARRAR LOGO"></picture>
    </div>
    
    <h1>فرم ثبت اطلاعات برای ثبت نام در کنگره مهندسی عمران</h1>
    <h2>شرکت 
      <span style="color: #3dcff3;"> کامپوزیت </span>
      مکرر
      </h2>
    <p class="subtitle">پر کردن تمام فیلدهای ستاره‌دار الزامی است.</p>

    <form id="userForm" name="userForm" novalidate>

      <div class="form-grid">

        <!-- نام و نام خانوادگی -->
        <div class="full">
          <label for="fullName">نام و نام خانوادگی <span class="req">*</span></label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="مثال: علی محمدی"
            autocomplete="name"
            required>
        </div>

        <!-- کد ملی -->
        <div>
          <label for="nationalId">کد ملی <span class="req">*</span></label>
          <input
            type="text"
            id="nationalId"
            name="nationalId"
            placeholder="۱۰ رقم، مثال: 0012345678"
            inputmode="numeric"
            maxlength="11"
            pattern="[0-9]{10}"
            autocomplete="off"
            required>
        </div>

        <!-- شماره تماس -->
        <div>
          <label for="phone">شماره تماس <span class="req">*</span></label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="مثال: 09123456789"
            inputmode="numeric"
            maxlength="11"
            pattern="09[0-9]{9}"
            autocomplete="tel"
            required>
        </div>

        <!-- رشته -->
        <div class="full">
          <label for="fieldOfStudy"> رشته و تخصص شما <span class="req">*</span></label>
          <input
            type="text"
            id="fieldOfStudy"
            name="fieldOfStudy"
            placeholder="مثال:  سازه / ژئوتکنیک"
            required>
        </div>

        <!-- گروه -->
        <div class="full">
          <label for="userGroup">شامل کدام گروه می‌باشید؟ <span class="req">*</span></label>
          <select id="userGroup" name="userGroup" required>
            <option value="" selected disabled>— لطفاً انتخاب کنید —</option>
            <option value="دانشجو">دانشجو</option>
            <option value="هیئت علمی">هیئت علمی</option>
            <option value=" بخش خصوصی">بخش خصوصی</option>
            <option value=" بخش دولتی ">  بخش دولتی  </option>
            <option value="سایر">سایر</option>
          </select>
        </div>

        <!-- لوگو -->
        <!-- سازمان -->
        <div class="full">
          <label for="organ"> وابستگی سازمانی <span class="req">*</span></label>
          <input
            type="text"
            id="organ"
            name="organ"
            placeholder="مثال:  دانشگاه صنعتی اصفهان / آبفای تهران ..."
            required>
        </div>


      </div>

      <button type="submit" id="submitBtn">تأیید و ارسال</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </div>

  <script>
    /* ==========================================================
       ۱) آدرس Web App گوگل‌اسکریپت را اینجا قرار دهید
       ========================================================== */
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyZ7Ghs3Kst3cma0RHWG_nKHG-osqJmOo3QsVO6dIza0tKVdNLvhLRPH6C6iBl3dnaR9A/exec';


    /* ---------- عناصر ---------- */
    const form           = document.getElementById('userForm');
    const messageDiv     = document.getElementById('message');
    const submitBtn      = document.getElementById('submitBtn');


    let isLocked     = false;   // قفل ارسال
    let countdownTimer = null;

    /* ==========================================================
       ۲) توابع کمکی نمایش پیام
       ========================================================== */
    function showError(text, el) {
      messageDiv.className = 'error';
      messageDiv.textContent = '❌ ' + text;
      if (el) {
        el.classList.add('invalid');
        el.focus();
      }
    }

    function showSuccess(text) {
      messageDiv.className = 'success';
      messageDiv.textContent = '✅ ' + text;
    }

    function clearMessage() {
      messageDiv.className = '';
      messageDiv.textContent = '';
      form.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
    }

    /* ==========================================================
       ۳) تبدیل و کوچک‌سازی تصویر لوگو به Base64
       ========================================================== */
    function fileToResizedDataURL(file, maxSize = 200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = () => reject(new Error('خطا در خواندن فایل لوگو'));
        reader.onload = () => {
          const img = new Image();

          img.onerror = () => reject(new Error('فایل انتخاب‌شده تصویر معتبری نیست'));
          img.onload = () => {
            let { width, height } = img;

            if (width >= height && width > maxSize) {
              height = Math.round(height * maxSize / width);
              width  = maxSize;
            } else if (height > maxSize) {
              width  = Math.round(width * maxSize / height);
              height = maxSize;
            }

            const canvas = document.createElement('canvas');
            canvas.width  = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';                 // پس‌زمینه سفید برای خروجی JPEG
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };

          img.src = reader.result;
        };

        reader.readAsDataURL(file);
      });
    }



    /* ==========================================================
       ۴) مدیریت قفل و شمارش معکوس ۵ ثانیه‌ای
       ========================================================== */
    function unlockForm() {
      isLocked = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'تأیید و ارسال';
    }

 

    /* ---------- ریست کامل فرم ---------- */
    function resetForm() {
      form.reset();

      form.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
    }

    /* ==========================================================
       ۵) اعتبارسنجی و ارسال
       ========================================================== */
    const PERSIAN_NAME_REGEX = /^[\u0600-\u06FF\u200c\s]{3,}$/;  // حروف فارسی + فاصله + نیم‌فاصله
    const NATIONAL_ID_REGEX  = /^[0-9]{10}$/;                    // دقیقاً ۱۰ رقم
    const PHONE_REGEX        = /^09[0-9]{9}$/;                   // ۱۱ رقم و شروع با 09

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isLocked) return;      // جلوگیری از ارسال مجدد

      clearMessage();

      const fullName     = form.fullName.value;
      const nationalId   = form.nationalId.value;
      const phone        = form.phone.value;
      const fieldOfStudy = form.fieldOfStudy.value;
      const userGroup    = form.userGroup.value;
      const organ        = form.organ.value;


      /* --- اعتبارسنجی --- */
      if (!fullName) {
        return showError('لطفاً نام و نام خانوادگی را وارد کنید.', form.fullName);
      }
      if (!PERSIAN_NAME_REGEX.test(fullName)) {
        return showError('نام و نام خانوادگی باید فقط با حروف فارسی و حداقل ۳ حرف نوشته شود.', form.fullName);
      }
      if (!NATIONAL_ID_REGEX.test(nationalId)) {
        return showError('کد ملی باید دقیقاً یک عدد ۱۰ رقمی باشد.\n از کیبورد انگلیسی استفاده کنید', form.nationalId);
      }
      if (!PHONE_REGEX.test(phone)) {
        return showError('شماره تماس باید ۱۱ رقمی و با 09 شروع شود. مثال: 09123456789', form.phone);
      }
      if (fieldOfStudy.length < 2) {
        return showError('لطفاً رشته خود را وارد کنید (حداقل ۲ حرف).', form.fieldOfStudy);
      }
      if (organ.length < 2) {
        return showError('لطفاً سازمان خود را وارد کنید (حداقل ۲ حرف).', form.organ);
      }


      if (!userGroup) {
        return showError('لطفاً مشخص کنید شامل کدام گروه می‌باشید.', form.userGroup);
      }

      /* --- آماده‌سازی داده‌ها برای گوگل‌شیت --- */
      const data = new URLSearchParams();
      data.append('fullName',     fullName);      // نام و نام خانوادگی
      data.append('nationalId',   nationalId);    // کد ملی
      data.append('phone',        phone);         // شماره تماس
      data.append('fieldOfStudy', fieldOfStudy);  // رشته
      data.append('organ', organ);  // رشته
      data.append('userGroup',    userGroup);     // گروه

      /* --- قفل کردن دکمه قبل از ارسال --- */
      isLocked = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ارسال...';

      try {
        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',          // جلوگیری از خطای CORS در گوگل‌اسکریپت
          body: data
        });

        // چون mode = no-cors است، پاسخ قابل خواندن نیست و ارسال موفق فرض می‌شود
        showSuccess('اطلاعات با موفقیت ثبت شد. با تشکر!');
        resetForm();

      } catch (error) {
        showError('خطا در ارسال اطلاعات: ' + error.message);
        unlockForm();               // در صورت خطا کاربر می‌تواند بلافاصله دوباره تلاش کند
      }
    });

    /* ---------- حذف حالت خطا هنگام تایپ ---------- */
    form.querySelectorAll('input, select, textarea').forEach(el => {
      el.addEventListener('input', () => {
        el.classList.remove('invalid');
      });
      el.addEventListener('change', () => {
        el.classList.remove('invalid');
      });
    });
  </script>
</body>
</html>
