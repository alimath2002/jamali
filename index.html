<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم اطلاعات تماس</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #f0f2f5 100%);
    margin: 0; padding: 24px 16px; min-height: 100vh;
  }
  .container {
    max-width: 760px; margin: 0 auto; background: #fff;
    padding: 32px; border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
  }
  h1 { text-align: center; color: #1a237e; font-size: 1.5rem; margin: 0 0 8px; }
  h2 { font-size: 1.05rem; color: #1a237e; margin: 28px 0 16px;
       padding-bottom: 8px; border-bottom: 2px solid #e3f2fd; }
  .subtitle { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label.lbl { display: block; margin-bottom: 6px; font-weight: 500; color: #333; font-size: 0.95rem; }
  .req { color: #e53935; }
  input[type="text"], input[type="tel"], input[type="email"], select, textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid #d0d5dd;
    border-radius: 10px; font-family: inherit; font-size: 1rem;
    transition: border-color 0.2s, box-shadow 0.2s; background: #fafbfc;
  }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: #1976d2; background: #fff;
    box-shadow: 0 0 0 3px rgba(25,118,210,0.1);
  }
  input.error, select.error, textarea.error { border-color: #e53935; background: #fff5f5; }
  .error-msg { color: #e53935; font-size: 0.82rem; margin-top: 5px; display: none; }
  .error-msg.show { display: block; }
  .hint { font-size: 0.78rem; color: #888; margin-top: 4px; }
  .checkbox-group, .radio-group { display: flex; flex-wrap: wrap; gap: 10px; }
  .checkbox-group label, .radio-group label {
    display: flex; align-items: center; gap: 6px; padding: 9px 14px;
    background: #f5f7fa; border: 1.5px solid transparent;
    border-radius: 10px; cursor: pointer; font-weight: 400;
    font-size: 0.9rem; transition: all 0.15s; user-select: none;
  }
  .checkbox-group label:hover, .radio-group label:hover { background: #eef2f7; }
  .checkbox-group label:has(input:checked),
  .radio-group label:has(input:checked) { background: #e3f2fd; border-color: #1976d2; }
  .checkbox-group input:checked + span,
  .radio-group input:checked + span { font-weight: 600; color: #1976d2; }
  button {
    width: 100%; padding: 14px; background: #1976d2; color: white;
    border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 600;
    font-family: inherit; cursor: pointer; margin-top: 12px;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover:not(:disabled) { background: #1565c0; }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { background: #90caf9; cursor: not-allowed; }
  .message { margin-top: 20px; padding: 14px; border-radius: 10px;
             text-align: center; display: none; font-size: 0.95rem; }
  .message.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .message.error { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; gap: 0; } }
  @media (max-width: 520px) {
    .container { padding: 22px 18px; border-radius: 12px; }
    body { padding: 12px 10px; }
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>
<div class="container">
    <div style="direction: ltr;"> <picture><img src="./images/logocm01.png" alt="MOKARRAR LOGO" style="width: 50%;"></picture></div>

  <h1>فرم اطلاعات تماس</h1>
  <p class="subtitle">لطفاً اطلاعات خود را با دقت تکمیل کنید. فیلدهای ستاره‌دار الزامی هستند.</p>

  <form id="contactForm" novalidate>

    <div class="grid-2">
      <div class="form-group">
        <label class="lbl" for="firstName">نام <span class="req">*</span></label>
        <input type="text" id="firstName" placeholder="مثال: علی" autocomplete="given-name" maxlength="50">
        <div class="error-msg" id="firstName-error"></div>
      </div>
      <div class="form-group">
        <label class="lbl" for="lastName">نام خانوادگی <span class="req">*</span></label>
        <input type="text" id="lastName" placeholder="مثال: محمدی" autocomplete="family-name" maxlength="50">
        <div class="error-msg" id="lastName-error"></div>
      </div>
    </div>

    <div class="form-group">
      <label class="lbl" for="companyName">نام شرکت / سازمان <span class="req">*</span></label>
      <input type="text" id="companyName" placeholder="مثال: شرکت فناوران صنعت" maxlength="100">
      <div class="hint">فقط حروف فارسی</div>
      <div class="error-msg" id="companyName-error"></div>
    </div>

      <div class="form-group">
        <label class="lbl" for="semat">سمت شغلی<span class="req">*</span></label>
        <input type="text" id="semat" placeholder="مثال: مدیر‌عامل" autocomplete="family-name" maxlength="50">
        <div class="error-msg" id="semat-error"></div>
      </div>
    
    <div class="form-group">
      <label class="lbl">در چه زمینه‌هایی فعالیت دارید؟ <span class="req">*</span></label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="activity" value="آب و کشاورزی"><span>آب و کشاورزی</span></label>
        <label><input type="checkbox" name="activity" value="معدن"><span>معدن</span></label>
        <label><input type="checkbox" name="activity" value="نفت و پتروشیمی"><span>نفت و پتروشیمی</span></label>
        <label><input type="checkbox" name="activity" value="محل دفن و پسماند"><span>محل دفن و پسماند</span></label>
        <label><input type="checkbox" name="activity" value="راهسازی"><span>راهسازی</span></label>
        <label><input type="checkbox" name="activity" value="سازه و ساخت"><span>سازه و ساخت</span></label>
        <label><input type="checkbox" name="activity" value="سایر" id="activityOther-check"><span>سایر</span></label>
      </div>
      <div id="activityOther-wrap" style="display:none; margin-top:10px;">
        <input type="text" id="activityOther" placeholder="زمینه کاری خود را وارد کنید" maxlength="200">
        <div class="error-msg" id="activityOther-error"></div>
      </div>
      <div class="error-msg" id="activity-group-error"></div>
    </div>

    <div class="form-group">
      <label class="lbl">چه خدمتی را می‌خواهید دریافت کنید؟ <span class="req">*</span></label>
      <div class="radio-group">
        <label><input type="radio" name="service" value="مشاوره و طراحی"><span>مشاوره و طراحی</span></label>
        <label><input type="radio" name="service" value="دریافت قیمت و پیش فاکتور"><span>دریافت قیمت و پیش فاکتور</span></label>
        <label><input type="radio" name="service" value="اطلاعات مهم"><span>اطلاعات مهم</span></label>
        <label><input type="radio" name="service" value="اطلاعات راجب محصولات"><span>اطلاعات راجب محصولات</span></label>
        <label><input type="radio" name="service" value="سایر" id="serviceOther-radio"><span>سایر</span></label>
      </div>
      <div id="serviceOther-wrap" style="display:none; margin-top:10px;">
        <input type="text" id="serviceOther" placeholder="خدمت مورد نظر را وارد کنید" maxlength="200">
        <div class="error-msg" id="serviceOther-error"></div>
      </div>
      <div class="error-msg" id="service-group-error"></div>
    </div>

    <h2>اطلاعات تماس</h2>

    <div class="grid-2">
      <div class="form-group">
        <label class="lbl" for="phone">شماره تماس <span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="09123456789" inputmode="numeric" maxlength="11" autocomplete="tel">
        <div class="hint">۱۱ رقم و شروع با ۰۹</div>
        <div class="error-msg" id="phone-error"></div>
      </div>
      <div class="form-group">
        <label class="lbl" for="email">ایمیل</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="email">
        <div class="error-msg" id="email-error"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label class="lbl" for="fax">فکس</label>
        <input type="text" id="fax" placeholder="021-12345678">
        <div class="hint">مثال: 021-12345678 یا +98-21-12345678</div>
        <div class="error-msg" id="fax-error"></div>
      </div>
      <div class="form-group">
        <label class="lbl" for="postalCode">کد پستی</label>
        <input type="text" id="postalCode" placeholder="1234567890" inputmode="numeric" maxlength="10">
        <div class="hint">۱۰ رقم</div>
        <div class="error-msg" id="postalCode-error"></div>
      </div>
    </div>

    <div class="form-group">
      <label class="lbl" for="website">لینک به وبسایت شرکت یا شخصی</label>
      <input type="text" id="website" placeholder="https://example.com">
      <div class="error-msg" id="website-error"></div>
    </div>

    <button type="submit" id="submitBtn">ارسال اطلاعات</button>
    <div class="message" id="formMessage"></div>
  </form>
</div>

<script>
// ⚠️ آدرس Apps Script خود را اینجا قرار دهید (توضیحات پایین)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw-GAbVTATegZdGB9v5EscBRk-qEzS-mQNgaKTzO-SJeVA-hH9me2wkLxgjlajuh1joJA/exec';

const PERSIAN_RE = /^[\u0600-\u06FF\u200C\s]+$/;
const PHONE_RE   = /^09\d{9}$/;
const EMAIL_RE   = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const POSTAL_RE  = /^\d{10}$/;
const FAX_RE     = /^[+]?[0-9\s\-()]+$/;

const form = document.getElementById('contactForm');
const submitBtn = document.getElementById('submitBtn');
const formMessage = document.getElementById('formMessage');
const v = id => document.getElementById(id).value.trim();

function showError(id, msg) {
  const el = document.getElementById(id);
  if (el) el.classList.add('error');
  const err = document.getElementById(id + '-error');
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearError(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('error');
  const err = document.getElementById(id + '-error');
  if (err) { err.classList.remove('show'); err.textContent = ''; }
}
function clearAllErrors() {
  document.querySelectorAll('.error').forEach(e => e.classList.remove('error'));
  document.querySelectorAll('.error-msg').forEach(e => { e.classList.remove('show'); e.textContent = ''; });
}

function validateFax(value) {
  if (!FAX_RE.test(value)) return false;
  const digits = value.replace(/\D/g, '');
  return digits.length >= 8 && digits.length <= 15;
}

function validateForm() {
  clearAllErrors();
  let valid = true;

  if (!v('firstName')) { showError('firstName', 'نام الزامی است'); valid = false; }
  if (!v('lastName'))  { showError('lastName',  'نام خانوادگی الزامی است'); valid = false; }
  if (!v('semat'))  { showError('semat',  'سمت الزامی است'); valid = false; }


  
  if (!v('companyName')) { showError('companyName', 'نام شرکت / سازمان الزامی است'); valid = false; }
  else if (!PERSIAN_RE.test(v('companyName'))) {
    showError('companyName', 'لطفاً فقط حروف فارسی وارد کنید'); valid = false;
  }

  const activities = Array.from(document.querySelectorAll('input[name="activity"]:checked'));
  if (activities.length === 0) {
    showError('activity-group', 'حداقل یک زمینه فعالیت انتخاب کنید'); valid = false;
  } else if (activities.some(a => a.value === 'سایر') && !v('activityOther')) {
    showError('activityOther', 'لطفاً زمینه کاری خود را وارد کنید'); valid = false;
  }

  const service = document.querySelector('input[name="service"]:checked');
  if (!service) {
    showError('service-group', 'لطفاً یک خدمت انتخاب کنید'); valid = false;
  } else if (service.value === 'سایر' && !v('serviceOther')) {
    showError('serviceOther', 'لطفاً خدمت مورد نظر را وارد کنید'); valid = false;
  }

  if (!v('phone')) { showError('phone', 'شماره تماس الزامی است'); valid = false; }
  else if (!PHONE_RE.test(v('phone'))) {
    showError('phone', 'شماره باید ۱۱ رقم و با ۰۹ شروع شود'); valid = false;
  }

  if (v('email') && !EMAIL_RE.test(v('email'))) {
    showError('email', 'فرمت ایمیل معتبر نیست'); valid = false;
  }
  if (v('fax') && !validateFax(v('fax'))) {
    showError('fax', 'فرمت فکس معتبر نیست (حداقل ۸ رقم)'); valid = false;
  }
  if (v('postalCode') && !POSTAL_RE.test(v('postalCode'))) {
    showError('postalCode', 'کد پستی باید دقیقاً ۱۰ رقم باشد'); valid = false;
  }

  return valid;
}

function collectData() {
  const activities = Array.from(document.querySelectorAll('input[name="activity"]:checked'))
    .map(cb => cb.value === 'سایر' ? `سایر: ${v('activityOther')}` : cb.value)
    .join('، ');

  const serviceRadio = document.querySelector('input[name="service"]:checked');
  const serviceType = serviceRadio.value === 'سایر'
    ? `سایر: ${v('serviceOther')}`
    : serviceRadio.value;

  return {
    firstName:   v('firstName'),
    lastName:    v('lastName'),
    semat:v('semat'),
    companyName: v('companyName'),
    activities:  activities,
    serviceType: serviceType,
    phone:       v('phone'),
    email:       v('email'),
    fax:         v('fax'),
    postalCode:  v('postalCode'),
    website:     v('website'),
  };
}

// نمایش/مخفی کردن فیلد «سایر» برای زمینه فعالیت
document.getElementById('activityOther-check').addEventListener('change', function () {
  const wrap  = document.getElementById('activityOther-wrap');
  const input = document.getElementById('activityOther');
  if (this.checked) { wrap.style.display = 'block'; input.focus(); }
  else { wrap.style.display = 'none'; input.value = ''; clearError('activityOther'); }
});

// نمایش/مخفی کردن فیلد «سایر» برای خدمت درخواستی
document.querySelectorAll('input[name="service"]').forEach(radio => {
  radio.addEventListener('change', () => {
    const wrap  = document.getElementById('serviceOther-wrap');
    const input = document.getElementById('serviceOther');
    if (document.getElementById('serviceOther-radio').checked) {
      wrap.style.display = 'block'; input.focus();
    } else {
      wrap.style.display = 'none'; input.value = ''; clearError('serviceOther');
    }
  });
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  formMessage.className = 'message';
  formMessage.textContent = '';

  if (!validateForm()) {
    const firstErr = document.querySelector('.error');
    if (firstErr) firstErr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'در حال ارسال...';

  try {
    const data = collectData();
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    formMessage.className = 'message success';
    formMessage.textContent = '✅ اطلاعات شما با موفقیت ثبت شد. به زودی با شما تماس خواهیم گرفت.';
    form.reset();
    document.getElementById('activityOther-wrap').style.display = 'none';
    document.getElementById('serviceOther-wrap').style.display = 'none';
    formMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
  } catch (err) {
    console.error(err);
    formMessage.className = 'message error';
    formMessage.textContent = '❌ خطا در ارسال اطلاعات. لطفاً اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'ارسال اطلاعات';
  }
});

// پاک کردن خطا هنگام تایپ
document.querySelectorAll('input, select, textarea').forEach(el => {
  el.addEventListener('input', () => clearError(el.id));
});
document.querySelectorAll('input[name="activity"]').forEach(el => {
  el.addEventListener('change', () => clearError('activity-group'));
});
document.querySelectorAll('input[name="service"]').forEach(el => {
  el.addEventListener('change', () => clearError('service-group'));
});
</script>
</body>
</html>
